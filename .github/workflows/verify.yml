name: Verify npm artifact
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: Verification tier
        required: true
        type: choice
        default: default
        options: [core, default, deep]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install GNU test engines
        run: |
          sudo apt-get update
          sudo apt-get install --yes grep ripgrep bash coreutils python3 locales
      - name: Verify extracted npm artifact
        env:
          REQUESTED_TIER: ${{ inputs.tier || 'default' }}
        run: |
          case "$REQUESTED_TIER" in
            core) node tools/verify-artifact.mjs --core --output artifacts/verification.json ;;
            default) node tools/verify-artifact.mjs --output artifacts/verification.json ;;
            deep) node tools/verify-artifact.mjs --deep --output artifacts/verification.json ;;
            *) exit 2 ;;
          esac
      - name: Retain bounded verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grep2rg-verification
          path: artifacts/verification.json
          if-no-files-found: warn
          retention-days: 14
  verify-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Install independent GNU oracle
        run: |
          sudo apt-get update
          sudo apt-get install --yes grep bash coreutils python3 strace build-essential
      - name: Resolve locked Rust dependencies
        run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - name: Verify extracted Rust units, GNU campaigns and Node integration
        run: node tools/verify-rust-artifact.mjs --output artifacts/rust-artifact.json
      - name: Retain Rust qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grep2rg-rust-verification
          path: artifacts/rust-artifact.json
          if-no-files-found: error
          retention-days: 14
